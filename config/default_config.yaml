# -------- MCP 服务器（延迟加载） --------
mcp_servers: []

# -------- 权限 --------
permissions:
  default_level: READ
  max_frequency: 10
  frequency_window_seconds: 300

# -------- 工作区 --------
workspace: ""               # 空 = 当前目录

# -------- 执行限制 --------
max_iterations: 50

# -------- 记忆存储 --------
memory_path: ""             # 空 = ~/.coding-agent/memory.jsonl

# -------- 沙箱 --------
sandbox:
  type: subprocess
  timeout_seconds: 120
  blocked_commands:
    - "rm -rf /"
    - "sudo"
    - "dd if="
    - "mkfs"
    - ":(){ :|:& };:"
    - "shutdown"
    - "reboot"
