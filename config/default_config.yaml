# ====== CodingAgent 默认配置 ======
# 项目级覆盖：创建 .coding-agent/config.yaml
# 全局覆盖：   ~/.coding-agent/config.yaml
# 环境变量：  ANTHROPIC_API_KEY / OPENAI_API_KEY

# -------- 模型配置 --------
model:
  provider: anthropic
  model: claude-sonnet-4-20250514

  ## 密钥（三种方式任选）
  # 1. 环境变量（推荐）: export ANTHROPIC_API_KEY="sk-ant-..."
  # 2. 配置文件:      api_key: "sk-ant-..."    （不推荐提交到 Git）
  # 3. 自定义环境变量: api_key_env: MY_CUSTOM_KEY
  # api_key: ""
  # api_key_env: ANTHROPIC_API_KEY

  ## 自定义端点（留空=官方）
  # base_url: ""    # 示例: https://api.deepseek.com/v1
  ## 温度 (null=API默认, 0.0=精确, 1.0=创意)
  # temperature: 0.7

  max_tokens: 8192
  context_window: 200000

