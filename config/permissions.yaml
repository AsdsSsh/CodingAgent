# CodingAgent Permission Policies
# Defines auto-approve rules and tool-specific overrides

auto_approve:
  read: true
  search: true
  web_fetch: true

max_frequency: 10
frequency_window_seconds: 300

# Tool-specific overrides (true = always allow, false = always deny)
tool_overrides: {}
  # bash: false       # Always prompt for bash commands
  # write: true       # Always allow file writes
  # edit: true        # Always allow file edits
